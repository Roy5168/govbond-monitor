name: 每日更新並發布

on:
  schedule:
    # 台灣時間 17:00、17:30、18:00、19:00（週一至週五）；櫃買偶爾晚發布，抓到後面幾次就不會再有新資料
    # 注意：GitHub 的排程實測常延遲約 8 小時，主要改由本機 17:00 的 launchd 工作用 gh 觸發（workflow_dispatch），這裡只當備援
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dates:
        description: "補抓期間（例：2026-11-03 2026-11-04），空白＝從資料最後一天補到今天"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["template.html", "bonddata.py", "update.py", "build_site.py", "parse_issues.py", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 排隊等候的 run 要拿最新的 main，不是觸發當下的版本，否則前一個 run 寫回資料後這裡 push 會被拒
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.2 cryptography==46.0.5

      - name: 抓櫃買日檔與官方發行資料
        run: python update.py ${{ github.event.inputs.dates }}

      - name: 產生一般版（/）與管理者版（/admin/，以 ADMIN_PASSWORD 加密）
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python build_site.py _site

      - name: 資料有變動才寫回版本庫
        run: |
          git config user.name "govbond-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/records.csv data/issues.csv
          if git diff --cached --quiet; then echo "資料沒有變動"; else
            git commit -m "資料更新至 $(tail -n +2 data/records.csv | cut -d, -f1 | sort | tail -1)" && git push; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
